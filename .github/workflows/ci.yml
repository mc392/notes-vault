name: CI

# Everything here runs on GitHub's macOS runners, so the whole build can be verified
# without owning a Mac. What it cannot do is run on real hardware — the iCloud Drive
# document picker, Face ID, and two-device sync all need a device. See README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Core and crypto tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Cache the one external dependency so a red build is not also a slow one.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # The core tests are fast and stub the cryptography. The crypto tests run real scrypt
      # against a real folder and take appreciably longer — worth it, because they are the
      # only thing asserting that what lands on disk is a genuine Cryptomator vault.
      - name: Test
        run: swift test

  build:
    name: Build the app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # Code signing is off: this proves the app compiles and links, which is the question
      # CI can answer. Signing needs a team ID and belongs on a real machine.
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project NotesVault.xcodeproj \
            -scheme NotesVault \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project NotesVault.xcodeproj \
            -scheme NotesVault \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
