# XcodeGen spec. `xcodegen generate` turns this into NotesVault.xcodeproj.
#
# The project file is generated rather than committed on purpose: a .pbxproj is unreadable
# in review, conflicts badly, and is the one file in an app repo nobody can sanity-check by
# eye. Everything that matters about the target is in this file instead.
name: NotesVault

options:
  bundleIdPrefix: com.charlottebloor
  createIntermediateGroups: true
  # XcodeGen defaults to the Xcode 16 project format, which Xcode 15 refuses to open at all
  # ("a future Xcode project file format (77)"). Nothing here needs Xcode 16 — the code
  # targets the iOS 17 SDK, which Xcode 15 has — so write the older format instead. Older
  # formats open in every newer Xcode; the reverse is not true, so this widens the range of
  # machines that can build this rather than narrowing it.
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  NotesVault:
    path: .

targets:
  NotesVault:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/NotesVaultApp
    dependencies:
      - package: NotesVault
        product: NotesVaultCore
      - package: NotesVault
        product: NotesVaultCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlottebloor.groundworknotes
        # The Apple Developer Program team this app is signed by. Not a secret — it
        # ships inside every build — but it must match the account Xcode is signed
        # into, or signing fails with "no profiles found".
        DEVELOPMENT_TEAM: L8B6623MNM
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: GroundWork Notes
        MARKETING_VERSION: "0.1.0"
        # The build number, and Apple refuses one it has already accepted for this
        # marketing version — a repeat is rejected at upload, after the archive, with a
        # message about the version already existing rather than about this line. So it is
        # bumped once per build that leaves the machine. Only an archive made by hand in
        # Xcode reads it: testflight.yml passes its own number on the xcodebuild command
        # line, taken from the tag, and Xcode Cloud substitutes its own when it is set to
        # manage build numbers. Build 1 is on TestFlight; this is build 2.
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The entitlements below are macOS App Sandbox concepts. iOS sandboxes every
        # app implicitly and no iOS provisioning profile carries them, so requesting
        # them on iOS fails signing outright — "provisioning profile doesn't include
        # the com.apple.security.app-sandbox entitlement" — which blocks both device
        # builds and TestFlight. Blank the file for the iOS SDKs so the entitlements
        # stay declared once, in one place, and apply only where they mean something.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": ""
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ""
        # No usage descriptions for camera, photos, microphone or contacts, because the app
        # asks for none of them. v1 is typed notes only (decision 03).
    info:
      path: Sources/NotesVaultApp/Resources/Info.plist
      properties:
        # iOS truncates the home-screen label at about twelve characters, so the full
        # name would read "GroundWork No…". CFBundleName keeps the full name for the
        # macOS menu bar and for App Store Connect; this is only the label under the icon.
        CFBundleDisplayName: GW Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        # The native launch screen, on screen for the moment before SwiftUI draws
        # SplashView over the top of it. Painted in the same sage as the splash, light
        # and dark, so the handover is invisible rather than a white flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required before LocalAuthentication will prompt at all on iOS. Without it the
        # biometric unlock fails silently at runtime.
        NSFaceIDUsageDescription: >-
          Face ID unlocks your clinical notes when you open the app, and confirms it is you
          before a note is opened or an access setting is changed. Your passphrase is stored
          in this device's keychain and never leaves it.
        # The app makes no network connections of its own. Declaring this makes that
        # checkable rather than a claim in the marketing copy.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Sources/NotesVaultApp/Resources/NotesVault.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The only file permission the app has: folders the user picks by hand. No iCloud
        # container entitlement, no network client entitlement — it cannot reach a server
        # even if a future change tried to.
        com.apple.security.files.user-selected.read-write: true

schemes:
  NotesVault:
    build:
      targets:
        NotesVault: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
